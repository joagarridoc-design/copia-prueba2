<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>


  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/Logo.png" alt="logo" height="40">
                <span class="fw-bold">CLstore</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="Nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="Blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="Registro.html">Registrate</a></li>
                </ul>
                <a href="Carrito.html" class="btn btn-primary rounded-pill ms-lg-3 d-none d-lg-inline-block">
                    <i class="fa-solid fa-cart-shopping me-1"></i> Carrito
                </a>
            </div>
        </div>
    </nav>

  <div class="container my-5" id="detalle-producto">
      <div class="row g-4">

          <div class="col-md-5">
            <div class="border rounded p-3 shadow-sm bg-white">
              <div id="productCarousel" class="carousel slide">
                
                <div class="carousel-inner" id="carrusel-imagenes"></div>
                <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                  <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                  <span class="carousel-control-next-icon"></span>
                </button>
              </div>
            </div>
          </div>


          <div class="col-md-7" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 10px;">
            <h2 class="fw-bold" id="detalle-nombre-precio"></h2>
            <p class="text-secondary fw-semibold fs-5"> <span id="detalle-descripcion"> </span> </p>

            <div class="border rounded p-3 shadow-sm mb-4" style="background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1) !important;">
                <!-- Cambiamos la tabla por una lista (ul) -->
                <ul id="detalle-specs" class="list-group list-group-flush mb-0">
                    <!-- Los ítems de la lista se inyectarán aquí -->
                </ul>
            </div>

           <button type="button"
            id="btn-agregar-detalle"
            class="btn btn-agregar fw-bold w-100 d-flex align-items-center justify-content-center"
            style="height: 70px; background-color: rgb(85, 205, 58); color: rgb(49, 49, 49); border: none;">
            Agregar al carrito
            </button>
          </div>
      </div>
      <div class="row mt-5 pt-5 g-4">

          <div class="col-lg-8">
            <h3 class="fw-bold mb-4">Reseñas</h3>
            <div>
                <span id="detalle-resenas">
            </div>
          </div>

          <div class="col-lg-4" >
            <span id="detalle-destacado"></span>
          </div>

      </div>

      <div class="row mt-5 pt-4 g-4">
        <div class="col-12">
          <h3 class="fw-bold mb-4">Productos relacionados</h3>
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
            <span id="productos-relacionados"></span>
        </div>
      </div>
  </div>

    <script src="js/scripts.js"></script>
